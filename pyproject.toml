[project]
name = "social-command-center"
version = "0.1.0"
description = "Post one short to YouTube, Instagram, Facebook and TikTok at once — local queue, scheduler and dashboard."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
]

[project.scripts]
scc = "scc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scc"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Broad catches are deliberate at the engine/job edges: an unknown failure mid-upload
# must become needs_review, never crash the scheduler.
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
