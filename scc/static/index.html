<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Main">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Social Command Center</span>
      <button id="navToggle" class="icon-btn" type="button" aria-label="Collapse or expand the sidebar"><span data-icon="menu"></span></button>

    <div class="nav" id="nav">
      <a href="#/library" data-route="library"><span data-icon="library"></span><span class="lbl">Library</span><span class="nav-badge" id="badgeLibrary" hidden></span></a>
